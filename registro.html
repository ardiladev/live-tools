  registro.html — Widget "Registro de bailarinas" para OBS / TikTok LIVE Studio (INVISIBLE).

  del widget, y la configuración (bailarinas, equipos y precios) llega en vivo desde Supabase.
  Código (React + TypeScript): src/widgets/registro/ · se compila con Vite (ver vite.config.ts).
-->
