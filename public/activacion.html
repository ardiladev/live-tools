<!doctype html>
<!--
  activacion.html — Widget "Barra de activación" para OBS / TikTok LIVE Studio
  (recomendado 1600 × 400). Una sola barra repartida en 2 a 4 cuadrantes, uno por equipo; cada
  equipo tiene su regalo activador. Quien envía el activador de un equipo se une a él, y desde
  ahí TODOS sus regalos le suman; si después envía el de otro, se cambia. Cada cuadrante ocupa
  la parte del total de monedas que lleva su equipo. Arriba va el reloj de la ronda: los regalos
  solo suman mientras corre y, al terminar, gana el equipo con más monedas.
  Estilos: css/aurea.css + css/widget.css + css/widgets/activacion.css · Lógica: js/widgets/activacion.js
  La URL la genera el panel (index.html): #c= lleva usuario, clave e identificador del widget,
  y la configuración llega en vivo desde Supabase.
-->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Barra de activación — overlay</title>

  <!-- Estilos -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/aurea.css">
  <link rel="stylesheet" href="css/widget.css">
  <link rel="stylesheet" href="css/widgets/activacion.css">

  <!-- Lógica -->
  <script type="module" src="js/widgets/activacion.js"></script>
</head>
<body>
  <main class="escena">
    <!-- Reloj de la ronda -->
    <div class="reloj cristal" id="reloj" role="timer">
      <span class="tiempo" id="tiempo">00:00</span>
      <span class="estado-reloj" id="estado-reloj"></span>
    </div>

    <div class="placa cristal">
      <!-- La barra: un cuadrante por equipo (el widget los arma con la plantilla de abajo) -->
      <div class="barra" id="barra"></div>
      <!-- Debajo, cada equipo: nombre, monedas, personas unidas y quien aportó más -->
      <div class="leyenda" id="leyenda"></div>
    </div>

    <!-- Quién va ganando, quién se unió, quién ganó -->
    <div class="aviso-juego" id="aviso" role="status" aria-live="polite"></div>
  </main>

  <template id="plantilla-cuadrante">
    <div class="cuadrante">
      <img class="regalo" alt="" hidden>
      <span class="porcentaje">0%</span>
    </div>
  </template>

  <template id="plantilla-ficha">
    <div class="ficha">
      <div class="icono">
        <img class="regalo" alt="" hidden>
        <span class="inicial" aria-hidden="true"></span>
      </div>
      <div class="datos">
        <div class="nombre"></div>
        <div class="monedas">0</div>
        <div class="detalle">
          <span class="miembros"></span>
          <span class="mejor"></span>
        </div>
      </div>
    </div>
  </template>
</body>
</html>
