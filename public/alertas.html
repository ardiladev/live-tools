<!doctype html>
<!--
  alertas.html — Widget "Alertas de eventos" para OBS / TikTok LIVE Studio (recomendado 1280 × 720).
  Avisos animados de regalos, seguidores y compartidos, uno tras otro.
  Estilos: css/widget.css + css/widgets/alertas.css · Lógica: js/widgets/alertas.js
  Se configura por la URL (#c=…), que genera el panel (index.html).
-->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alertas — overlay</title>

  <!-- Estilos -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap">
  <link rel="stylesheet" href="css/widget.css">
  <link rel="stylesheet" href="css/widgets/alertas.css">

  <!-- Lógica -->
  <script type="module" src="js/widgets/alertas.js"></script>
</head>
<body>
  <main class="escena">
    <div class="alerta" id="alerta" role="status" aria-live="polite">
      <!-- Emoji o imagen del regalo -->
      <div class="icono" id="icono"></div>
      <!-- Quién y qué hizo -->
      <div>
        <div class="quien" id="quien"></div>
        <div class="que" id="que"></div>
      </div>
    </div>
  </main>
</body>
</html>
