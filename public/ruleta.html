<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ruleta — overlay</title>
<link rel="stylesheet" href="css/widget.css">
<style>
  .escena {
    height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3vmin;
    transition: opacity .4s ease, transform .4s ease;
  }
  .escena.oculta { opacity: 0; transform: scale(.92); }

  .aviso {
    min-height: 1.2em;
    padding: .45em 1.1em;
    border-radius: 999px;
    background: var(--ciruela);
    color: var(--crema);
    font-weight: 800;
    font-size: clamp(18px, 4.2vmin, 44px);
    box-shadow: 0 .25em 0 var(--rosa);
    max-width: 90vw; text-align: center;
    visibility: hidden;
  }
  .aviso.visible { visibility: visible; animation: entra .35s ease-out; }

  .rueda {
    position: relative;
    width: min(86vw, 70vh);
    aspect-ratio: 1;
  }
  canvas { width: 100%; height: 100%; display: block; filter: drop-shadow(0 1.2vmin 0 rgba(59,20,70,.55)); }

  /* Puntero tipo pétalo, apuntando hacia la ruleta */
  .puntero {
    position: absolute; left: 50%; top: -2.5%;
    width: 11%; aspect-ratio: .78;
    transform: translateX(-50%);
    z-index: 2;
  }
  .puntero.golpe { animation: golpe .12s ease-out; }

  .resultado {
    min-height: 1.3em;
    font-weight: 800;
    font-size: clamp(22px, 6vmin, 64px);
    color: var(--crema);
    -webkit-text-stroke: .06em var(--ciruela);
    paint-order: stroke fill;
    text-align: center; max-width: 92vw;
    visibility: hidden;
  }
  .resultado.visible { visibility: visible; animation: premio .6s cubic-bezier(.2, 1.6, .4, 1); }

  .cola {
    font-weight: 500;
    font-size: clamp(14px, 3vmin, 30px);
    color: var(--ciruela);
    background: var(--rubor);
    padding: .2em .8em; border-radius: 999px;
    visibility: hidden;
  }
  .cola.visible { visibility: visible; }

  @keyframes entra   { from { transform: translateY(-30%); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes premio  { from { transform: scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes golpe   { 50% { transform: translateX(-50%) rotate(-14deg); } }

  @media (prefers-reduced-motion: reduce) {
    .aviso.visible, .resultado.visible, .puntero.golpe { animation: none; }
  }
</style>
</head>
<body>
  <main class="escena" id="escena">
    <div class="aviso" id="aviso" aria-live="polite"></div>
    <div class="rueda">
      <svg class="puntero" id="puntero" viewBox="0 0 78 100" aria-hidden="true">
        <path d="M39 100 C10 62 0 40 0 26 A39 26 0 0 1 78 26 C78 40 68 62 39 100Z" fill="#F7B731" stroke="#3B1446" stroke-width="6"/>
        <circle cx="39" cy="28" r="10" fill="#3B1446"/>
      </svg>
      <canvas id="lienzo" width="1000" height="1000" aria-label="Ruleta de premios"></canvas>
    </div>
    <div class="resultado" id="resultado" aria-live="polite"></div>
    <div class="cola" id="cola"></div>
  </main>

<script type="module">
  import { leerConfig, iniciarWidget } from "./js/comun.js";

  // ---------- Opciones por URL ----------
  // ?ocultar=1  → la ruleta solo aparece cuando hay giros
  // ?sonido=0   → sin sonido de clic
  // ?fondo=1    → fondo gris para verla en el navegador
  // ?prueba=1   → (modo directo) no se conecta a TikTok; solo recibe giros de prueba del panel
  // #c=…        → configuración completa (usuario, clave, premios). Si está, la ruleta funciona
  //               SOLA, sin server.js: se conecta a TikTok desde el navegador vía Euler Stream.
  //               Sin #c= funciona como antes, recibiendo los giros del server.js local.
  const params = new URLSearchParams(location.search);
  const OCULTAR_EN_REPOSO = params.get('ocultar') === '1';
  const SONIDO = params.get('sonido') !== '0';

  const MOVIMIENTO_REDUCIDO = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const DURACION_GIRO = MOVIMIENTO_REDUCIDO ? 1200 : 5200;   // ms
  const PAUSA_RESULTADO = 2800;                               // ms

  const COLORES = [
    { fondo: '#E5386F', texto: '#FFF6F0' },
    { fondo: '#3B1446', texto: '#FFF6F0' },
    { fondo: '#FFC9D6', texto: '#3B1446' },
    { fondo: '#8E2A5E', texto: '#FFF6F0' },
  ];

  const lienzo = document.getElementById('lienzo');
  const ctx = lienzo.getContext('2d');
  const $ = (id) => document.getElementById(id);
  const escena = $('escena'), aviso = $('aviso'), resultado = $('resultado'), cola = $('cola'), puntero = $('puntero');

  let premios = [];
  let rotacion = 0;
  let girando = false;
  const pendientes = [];

  // ---------- Dibujo ----------
  function colorDe(i, n) {
    let c = i % COLORES.length;
    if (i === n - 1 && n > 1 && c === 0) c = 2; // evita que el último y el primero queden iguales
    return COLORES[c];
  }

  function partirTexto(texto, maxAncho) {
    const palabras = texto.split(' ');
    const lineas = [];
    let linea = '';
    for (const p of palabras) {
      const prueba = linea ? linea + ' ' + p : p;
      if (ctx.measureText(prueba).width > maxAncho && linea) { lineas.push(linea); linea = p; }
      else linea = prueba;
    }
    if (linea) lineas.push(linea);
    return lineas.slice(0, 2);
  }

  function dibujar() {
    const n = premios.length;
    const c = lienzo.width / 2, r = c - 14;
    const seg = (Math.PI * 2) / n;
    ctx.clearRect(0, 0, lienzo.width, lienzo.height);

    ctx.save();
    ctx.translate(c, c);
    ctx.rotate(rotacion);

    for (let i = 0; i < n; i++) {
      const ini = -Math.PI / 2 + i * seg;
      const { fondo, texto } = colorDe(i, n);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, r, ini, ini + seg);
      ctx.closePath();
      ctx.fillStyle = fondo;
      ctx.fill();

      // Texto radial
      ctx.save();
      ctx.rotate(ini + seg / 2);
      ctx.fillStyle = texto;
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      const tam = n > 10 ? 30 : 38;
      ctx.font = `800 ${tam}px "Bricolage Grotesque", "Segoe UI", sans-serif`;
      const lineas = partirTexto(premios[i].texto, r * 0.58);
      lineas.forEach((l, k) => ctx.fillText(l, r - 64, (k - (lineas.length - 1) / 2) * tam * 1.05));
      ctx.restore();
    }

    // Aro exterior y separadores
    ctx.lineWidth = 14;
    ctx.strokeStyle = '#3B1446';
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.stroke();
    for (let i = 0; i < n; i++) {
      const a = -Math.PI / 2 + i * seg;
      ctx.fillStyle = '#F7B731';
      ctx.beginPath(); ctx.arc(Math.cos(a) * r, Math.sin(a) * r, 9, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();

    // Centro: una rosa simple
    ctx.save();
    ctx.translate(c, c);
    ctx.fillStyle = '#3B1446';
    ctx.beginPath(); ctx.arc(0, 0, 74, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#E5386F';
    for (let k = 0; k < 5; k++) {
      ctx.rotate((Math.PI * 2) / 5);
      ctx.beginPath(); ctx.ellipse(0, -24, 20, 30, 0, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = '#FFC9D6';
    ctx.beginPath(); ctx.arc(0, 0, 16, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // ---------- Sonido de clic ----------
  let audio;
  function clic() {
    if (!SONIDO) return;
    try {
      audio ??= new AudioContext();
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = 'triangle'; o.frequency.value = 1400;
      g.gain.setValueAtTime(0.12, audio.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.05);
      o.connect(g).connect(audio.destination);
      o.start(); o.stop(audio.currentTime + 0.06);
    } catch { /* sin audio disponible */ }
    puntero.classList.remove('golpe'); void puntero.offsetWidth; puntero.classList.add('golpe');
  }

  // ---------- Giro ----------
  const suavizar = (t) => 1 - Math.pow(1 - t, 4);

  function girarHacia(indice) {
    return new Promise((resolver) => {
      const n = premios.length, seg = (Math.PI * 2) / n;
      const variacion = (Math.random() - 0.5) * seg * 0.7;           // que no caiga siempre en el centro
      const objetivo = -((indice + 0.5) * seg) + variacion;
      const actual = ((rotacion % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
      let delta = ((objetivo - actual) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
      const vueltas = MOVIMIENTO_REDUCIDO ? 1 : 5 + Math.floor(Math.random() * 2);
      const desde = rotacion, hasta = rotacion + delta + vueltas * Math.PI * 2;
      const t0 = performance.now();
      let ultimoSector = Math.floor(desde / seg);

      function paso(ahora) {
        const t = Math.min((ahora - t0) / DURACION_GIRO, 1);
        rotacion = desde + (hasta - desde) * suavizar(t);
        const sector = Math.floor(rotacion / seg);
        if (sector !== ultimoSector) { ultimoSector = sector; clic(); }
        dibujar();
        if (t < 1) requestAnimationFrame(paso); else resolver();
      }
      requestAnimationFrame(paso);
    });
  }

  function actualizarCola() {
    cola.textContent = pendientes.length ? `+${pendientes.length} en espera` : '';
    cola.classList.toggle('visible', pendientes.length > 0);
  }

  async function procesar() {
    if (girando || !pendientes.length) return;
    girando = true;
    escena.classList.remove('oculta');

    while (pendientes.length) {
      const giro = pendientes.shift();
      actualizarCola();
      aviso.textContent = `${giro.usuario} envió ${giro.regalo || 'una rosa 🌹'}`;
      aviso.classList.remove('visible'); void aviso.offsetWidth; aviso.classList.add('visible');
      resultado.classList.remove('visible');

      await girarHacia(giro.indice);

      resultado.textContent = premios[giro.indice]?.texto ?? giro.premio;
      resultado.classList.add('visible');
      await new Promise((r) => setTimeout(r, PAUSA_RESULTADO));
    }

    girando = false;
    aviso.classList.remove('visible');
    resultado.classList.remove('visible');
    if (OCULTAR_EN_REPOSO) escena.classList.add('oculta');
  }

  function encolar(giro) {
    pendientes.push(giro);
    actualizarCola();
    procesar();
  }

  // ---------- Modo directo: configuración en la URL (#c=…), sin servidor ----------
  // Claves: g = id del regalo, r = texto en pantalla, gpr = giros por regalo,
  //         max = tope por combo, p = premios [[texto, peso], …]
  function iniciarModoDirecto(cfg) {
    premios = (Array.isArray(cfg.p) ? cfg.p : [])
      .map(([texto, peso]) => ({ texto: String(texto || ''), peso: Math.max(0, Number(peso) || 0) }))
      .filter((p) => p.texto);
    const giftId = String(cfg.g || '5655');
    const textoRegalo = String(cfg.r || 'una rosa 🌹');
    const girosPorRegalo = Math.max(1, Number(cfg.gpr) || 1);
    const maxGiros = Math.max(1, Number(cfg.max) || 20);
    if (premios.length >= 2) dibujar();

    function elegirPremio() {
      const total = premios.reduce((s, p) => s + p.peso, 0);
      let r = Math.random() * total;
      for (let i = 0; i < premios.length; i++) {
        r -= premios[i].peso;
        if (r < 0) return i;
      }
      return premios.length - 1;
    }

    iniciarWidget({
      cfg,
      alEvento(evento) {
        if (evento.tipo !== 'regalo' || evento.giftId !== giftId || premios.length < 2) return;
        const giros = Math.min(evento.cantidad * girosPorRegalo, maxGiros);
        for (let i = 0; i < giros; i++) {
          const indice = elegirPremio();
          encolar({ usuario: evento.usuario, indice, premio: premios[indice].texto, regalo: textoRegalo });
        }
      },
    });
  }

  // ---------- Modo servidor: los giros los decide server.js (npm start) ----------
  function iniciarModoServidor() {
    if (params.get('fondo') === '1') document.body.classList.add('vista-previa');
    const script = document.createElement('script');
    script.src = '/socket.io/socket.io.js';
    script.onerror = () => console.warn('[ruleta] No hay servidor local: abre la ruleta con la URL del panel (incluye #c=…).');
    script.onload = () => {
      const socket = io();
      socket.on('config', (cfg) => {
        premios = cfg.premios;
        if (!girando) dibujar();
      });
      socket.on('giro', encolar);
    };
    document.head.append(script);
  }

  const cfg = leerConfig();
  if (cfg) iniciarModoDirecto(cfg);
  else iniciarModoServidor();

  if (OCULTAR_EN_REPOSO) escena.classList.add('oculta');
  document.fonts.ready.then(() => premios.length && dibujar());
</script>
</body>
</html>
