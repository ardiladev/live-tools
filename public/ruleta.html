<!doctype html>
<!--
  ruleta.html — Widget "Ruleta de regalos" para OBS / TikTok LIVE Studio (1080 × 1920).
  Estilos: css/aurea.css + css/widget.css + css/widgets/ruleta.css · Lógica: js/widgets/ruleta.js
  La URL la genera el panel (index.html): #c= lleva usuario, clave e identificador del widget,
  y la configuración llega en vivo desde Supabase (o, sin Supabase, va completa en el #c=).
-->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ruleta — overlay</title>

  <!-- Estilos -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/aurea.css">
  <link rel="stylesheet" href="css/widget.css">
  <link rel="stylesheet" href="css/widgets/ruleta.css">

  <!-- Lógica (módulo: se ejecuta cuando el HTML ya está listo) -->
  <script type="module" src="js/widgets/ruleta.js"></script>
</head>
<body>
  <main class="escena" id="escena">
    <!-- Quién envió el regalo -->
    <div class="aviso cristal" id="aviso" aria-live="polite"></div>

    <!-- La rueda: el canvas la dibuja y el puntero marca el premio -->
    <div class="rueda">
      <!-- Puntero: gema facetada de oro bruñido (proporción 1 : φ). Cada faceta tiene su
           degradado para dar volumen; arriba, un destello con desenfoque. -->
      <svg class="puntero" id="puntero" viewBox="0 0 60 97" aria-hidden="true">
        <defs>
          <linearGradient id="faceta1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF4C2"/><stop offset="1" stop-color="#E2BE57"/></linearGradient>
          <linearGradient id="faceta2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EBCF73"/><stop offset="1" stop-color="#C39A2E"/></linearGradient>
          <linearGradient id="faceta3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D4AF37"/><stop offset="1" stop-color="#8C6216"/></linearGradient>
          <linearGradient id="faceta4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#AA771C"/><stop offset="1" stop-color="#5E400C"/></linearGradient>
          <filter id="destello" x="-1" y="-1" width="3" height="3"><feGaussianBlur stdDeviation="1.4"/></filter>
        </defs>
        <!-- Corona (arriba) y pabellón (la punta), dos facetas cada uno -->
        <path d="M14 4 H30 V22 H4 Z" fill="url(#faceta1)"/>
        <path d="M30 4 H46 L56 22 H30 Z" fill="url(#faceta2)"/>
        <path d="M4 22 H30 L30 93 Z" fill="url(#faceta3)"/>
        <path d="M30 22 H56 L30 93 Z" fill="url(#faceta4)"/>
        <!-- Aristas finas de luz -->
        <path d="M14 4 H46 L56 22 L30 93 L4 22 Z M4 22 H56 M30 4 V93" fill="none" stroke="#FFF1C1" stroke-opacity=".7" stroke-width=".8" stroke-linejoin="round"/>
        <!-- Destello -->
        <circle cx="21" cy="11" r="3" fill="#FFFFFF" filter="url(#destello)"/>
        <circle cx="21" cy="11" r="1.1" fill="#FFFFFF"/>
      </svg>
      <canvas id="lienzo" width="1000" height="1000" aria-label="Ruleta de premios"></canvas>
    </div>

    <!-- El premio que salió y los giros que esperan turno -->
    <div class="resultado cristal" id="resultado" aria-live="polite"></div>
    <div class="cola cristal" id="cola"></div>
  </main>
</body>
</html>
