<!doctype html>
<!--
  ruleta.html — Widget "Ruleta de regalos" para OBS / TikTok LIVE Studio (1080 × 1920).
  Estilos: css/widget.css + css/widgets/ruleta.css · Lógica: js/widgets/ruleta.js
  Funciona de dos formas:
    - ruleta.html?…#c=…  → sola, configurada por la URL (la genera el panel, index.html)
    - ruleta.html        → con el servidor local (npm start), que le manda los giros
-->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ruleta — overlay</title>

  <!-- Estilos -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap">
  <link rel="stylesheet" href="css/widget.css">
  <link rel="stylesheet" href="css/widgets/ruleta.css">

  <!-- Lógica (módulo: se ejecuta cuando el HTML ya está listo) -->
  <script type="module" src="js/widgets/ruleta.js"></script>
</head>
<body>
  <main class="escena" id="escena">
    <!-- Quién envió el regalo -->
    <div class="aviso" id="aviso" aria-live="polite"></div>

    <!-- La rueda: el canvas la dibuja y el puntero marca el premio -->
    <div class="rueda">
      <svg class="puntero" id="puntero" viewBox="0 0 78 100" aria-hidden="true">
        <path d="M39 100 C10 62 0 40 0 26 A39 26 0 0 1 78 26 C78 40 68 62 39 100Z" fill="#F7B731" stroke="#3B1446" stroke-width="6"/>
        <circle cx="39" cy="28" r="10" fill="#3B1446"/>
      </svg>
      <canvas id="lienzo" width="1000" height="1000" aria-label="Ruleta de premios"></canvas>
    </div>

    <!-- El premio que salió y los giros que esperan turno -->
    <div class="resultado" id="resultado" aria-live="polite"></div>
    <div class="cola" id="cola"></div>
  </main>
</body>
</html>
