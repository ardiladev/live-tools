<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panel LIVE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/panel.css">
</head>
<body>
<!-- Esqueleto del panel. Todo el contenido lo arma js/panel/app.js a partir de js/panel/registro.js -->
<header class="barra">
  <button class="btn-menu" id="btnMenu" aria-label="Abrir menú">☰</button>
  <div class="logo" aria-hidden="true">R</div>
  <nav class="ruta" id="ruta" aria-label="Ruta"></nav>
  <div class="derecha">
    <a class="pastilla-live" id="pastillaLive" href="#/actividad" style="text-decoration:none">LIVE</a>
    <a class="usuario-chip" href="#/conexion" style="color:inherit;text-decoration:none">
      <span class="avatar" id="avatar">?</span>
      <div><span id="nombreUsuario">Sin cuenta</span><small id="subUsuario">configura la conexión</small></div>
    </a>
  </div>
</header>

<nav class="riel" id="riel" aria-label="Categorías"></nav>
<aside class="menu" id="menu" aria-label="Menú"></aside>
<main id="contenido"></main>

<noscript><p style="margin-left:280px;padding-top:80px">Este panel necesita JavaScript.</p></noscript>
<script type="module" src="js/panel/app.js"></script>
</body>
</html>
