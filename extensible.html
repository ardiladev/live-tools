<!doctype html>
<!--
  extensible.html — Widget "Subathon extensible" para OBS / TikTok LIVE Studio (recomendado 900 × 400).
  El reloj del subathon con una meta de monedas: hasta juntar la meta, nada suma tiempo; desde
  que se cumple, los regalos y los taps (likes) extienden el reloj, hasta un tope.
  La URL la genera el panel (index.html): #c= lleva usuario, clave e identificador del widget,
  y la configuración (reloj, meta, tasas) llega en vivo desde Supabase.
  Código (React + TypeScript): src/widgets/extensible/ · se compila con Vite (ver vite.config.ts).
  Esta página solo carga el widget: la URL (y su #c=) es la misma de siempre en OBS / LIVE Studio.
-->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Subathon extensible — overlay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;600;700;800&display=swap">
</head>
<body>
  <div id="raiz"></div>
  <script type="module" src="/src/widgets/extensible/main.tsx"></script>
</body>
</html>
