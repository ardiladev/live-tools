<!doctype html>
<!--
  meta.html — Widget "Meta" para OBS / TikTok LIVE Studio (recomendado 1200 × 400).
  Una barra de progreso de likes, seguidores, compartidos o monedas.
  Estilos: css/aurea.css + css/widget.css + css/widgets/meta.css · Lógica: js/widgets/meta.js
  La URL la genera el panel (index.html): #c= lleva usuario, clave e identificador del widget,
  y la configuración llega en vivo desde Supabase (o, sin Supabase, va completa en el #c=).
-->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meta — overlay</title>

  <!-- Estilos -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/aurea.css">
  <link rel="stylesheet" href="css/widget.css">
  <link rel="stylesheet" href="css/widgets/meta.css">

  <!-- Lógica -->
  <script type="module" src="js/widgets/meta.js"></script>
</head>
<body>
  <main class="escena">
    <div class="meta cristal" id="meta">
      <!-- Barra con el porcentaje encima -->
      <div class="barra filo-oro">
        <div class="relleno" id="relleno"></div>
        <div class="porcentaje" id="porcentaje">0%</div>
      </div>
      <!-- "Título - actual / objetivo Unidad" -->
      <div class="etiqueta"><span id="texto"></span></div>
    </div>
  </main>
</body>
</html>
